<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>לילה עם שיר</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #1a1a2e;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    h1 {
      color: #f0e6d2;
      font-size: 1.15rem;
      margin-bottom: 8px;
      font-weight: 300;
      letter-spacing: 0.04em;
      text-align: center;
    }

    #book-area {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #flipbook {
      box-shadow: 0 8px 40px rgba(0,0,0,0.5), 0 2px 8px rgba(0,0,0,0.3);
      border-radius: 3px;
    }

    .page-content {
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .page-content img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      pointer-events: none;
      -webkit-user-drag: none;
    }

    .blank-page {
      background: #f5f0e8;
      width: 100%;
      height: 100%;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 18px;
      margin-top: 12px;
      direction: ltr;
    }

    .controls button {
      background: rgba(240, 230, 210, 0.08);
      border: 1px solid rgba(240, 230, 210, 0.15);
      color: #f0e6d2;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 0.95rem;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .controls button:hover:not(:disabled) {
      background: rgba(240, 230, 210, 0.2);
      border-color: rgba(240, 230, 210, 0.3);
    }

    .controls button:disabled {
      opacity: 0.12;
      cursor: default;
    }

    .page-info {
      color: rgba(240, 230, 210, 0.4);
      font-size: 0.75rem;
      min-width: 45px;
      text-align: center;
    }

    .hint {
      color: rgba(240, 230, 210, 0.22);
      font-size: 0.65rem;
      margin-top: 6px;
    }

    .book-shadow {
      width: 80%;
      max-width: 500px;
      height: 14px;
      margin-top: 2px;
      background: radial-gradient(ellipse, rgba(0,0,0,0.3) 0%, transparent 70%);
    }

    #loading {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 1000;
      transition: opacity 0.5s;
    }
    #loading.done { opacity: 0; pointer-events: none; }
    .spinner {
      width: 28px; height: 28px;
      border: 2px solid rgba(240,230,210,0.12);
      border-top-color: #f0e6d2;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .load-text { color: rgba(240,230,210,0.4); font-size: 0.8rem; }
  </style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <div class="load-text">לילה עם שיר</div>
</div>

<h1>לילה עם שיר</h1>

<div id="book-area">
  <div id="flipbook"></div>
</div>
<div class="book-shadow"></div>

<div class="controls">
  <button id="btn-prev" aria-label="Previous page">&#9654;</button>
  <span class="page-info" id="page-info"></span>
  <button id="btn-next" aria-label="Next page">&#9664;</button>
</div>
<div class="hint">&#8592; &#8594; &nbsp; לדפדוף</div>

<script src="https://unpkg.com/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
<script>
(function() {
  'use strict';

  var TOTAL = 31;
  var PW = 850, PH = 1200;

  // Pages are loaded in REVERSE order so that StPageFlip's native
  // flipPrev (left-to-right) becomes "next page" in Hebrew reading.
  // A blank page is appended so the front cover lands on the RIGHT
  // side of its spread (correct for Hebrew).
  // Array: [page-31(back cover), page-30, ..., page-02, page-01(front cover), blank]
  // Index:  0                    1             29        30                    31
  // With showCover, index 0 is a single right cover, index 31 is single left cover.
  // startPage: 30 → spread [29,30] = [page-02 LEFT, page-01 RIGHT]

  var ARR_LEN = TOTAL;
  var START_PAGE = TOTAL - 1;

  function pageSize() {
    var vh = window.innerHeight - 100;
    var vw = window.innerWidth - 16;
    var h = Math.min(vh, 700);
    var w = Math.round(h * (PW / PH));
    if (w * 2 > vw) {
      w = Math.floor(vw / 2);
      h = Math.round(w * (PH / PW));
    }
    return { w: w, h: h };
  }

  // Convert array index to real page number (0 = blank/back cover)
  function realPage(idx) {
    if (idx >= TOTAL) return 0; // blank page
    return TOTAL - idx;
  }

  function init() {
    var size = pageSize();
    var el = document.getElementById('flipbook');

    el.style.width = (size.w * 2) + 'px';
    el.style.height = size.h + 'px';

    var book = new St.PageFlip(el, {
      width: size.w,
      height: size.h,
      size: 'fixed',
      showCover: true,
      maxShadowOpacity: 0.35,
      mobileScrollSupport: false,
      useMouseEvents: true,
      clickEventForward: false,
      swipeDistance: 30,
      flippingTime: 900,
      drawShadow: true,
      usePortrait: false,
      startPage: START_PAGE,
      autoSize: true,
    });

    // Build pages in reverse order + blank at the end
    var pages = [];
    for (var i = TOTAL; i >= 1; i--) {
      var div = document.createElement('div');
      div.className = 'page-content';
      var img = document.createElement('img');
      img.src = 'pages/page-' + String(i).padStart(2, '0') + '.jpg';
      img.alt = 'Page ' + i;
      img.loading = (i <= 2 || i >= TOTAL - 1) ? 'eager' : 'lazy';
      div.appendChild(img);
      pages.push(div);
    }
    book.loadFromHTML(pages);

    // Loading
    var coverImg = pages[TOTAL - 1].querySelector('img'); // page-01
    function loaded() {
      document.getElementById('loading').classList.add('done');
    }
    if (coverImg && coverImg.complete) loaded();
    else if (coverImg) coverImg.addEventListener('load', loaded);
    setTimeout(loaded, 2500);

    // UI
    var info = document.getElementById('page-info');
    var btnP = document.getElementById('btn-prev');
    var btnN = document.getElementById('btn-next');

    function ui() {
      var idx = book.getCurrentPageIndex();
      var rp = realPage(idx);
      if (rp === 0) rp = TOTAL; // on the blank/last page, show total
      info.textContent = rp + ' / ' + TOTAL;
      // At start of reading (high index) = disable prev
      // At end of reading (low index) = disable next
      btnP.disabled = (idx >= ARR_LEN - 2);
      btnN.disabled = (idx <= 0);
    }

    book.on('flip', ui);
    ui();

    // REVERSED: "next in reading" = flipPrev (left-to-right, Hebrew style)
    //           "prev in reading" = flipNext (right-to-left)
    btnN.addEventListener('click', function() { book.flipPrev(); });
    btnP.addEventListener('click', function() { book.flipNext(); });

    // Keyboard: left arrow = next in reading = flipPrev
    document.addEventListener('keydown', function(e) {
      switch (e.key) {
        case 'ArrowLeft':
        case 'ArrowDown':
          e.preventDefault();
          book.flipPrev();
          break;
        case 'ArrowRight':
        case 'ArrowUp':
          e.preventDefault();
          book.flipNext();
          break;
        case ' ':
          e.preventDefault();
          book.flipPrev();
          break;
      }
    });

    // Swipe: swipe right = next in Hebrew reading = flipPrev
    var tx = 0;
    el.addEventListener('touchstart', function(e) {
      tx = e.touches[0].clientX;
    }, { passive: true });
    el.addEventListener('touchend', function(e) {
      var dx = e.changedTouches[0].clientX - tx;
      if (Math.abs(dx) > 50) {
        if (dx > 0) book.flipPrev();  // swipe right = next in Hebrew
        else book.flipNext();          // swipe left = prev in Hebrew
      }
    }, { passive: true });

    // Resize
    var rt;
    window.addEventListener('resize', function() {
      clearTimeout(rt);
      rt = setTimeout(function() {
        var s = pageSize();
        el.style.width = (s.w * 2) + 'px';
        el.style.height = s.h + 'px';
        book.updateFromHtml(pages);
      }, 200);
    });

    // Preload nearby pages
    book.on('flip', function() {
      var idx = book.getCurrentPageIndex();
      for (var j = Math.max(0, idx - 4); j <= Math.min(TOTAL - 1, idx + 4); j++) {
        var rr = realPage(j);
        if (rr > 0) (new Image()).src = 'pages/page-' + String(rr).padStart(2, '0') + '.jpg';
      }
    });
  }

  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
})();
</script>
</body>
</html>
